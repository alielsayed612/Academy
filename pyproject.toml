[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alahd-erp"
version = "1.2.0"            # keep in sync with alahd_erp/__init__.py::__version__
description = "Yawm Jadid Academy Suite (أكاديمية يوم جديد) - offline single-user desktop ERP (FastAPI + SQLite + PyWebView)"
requires-python = ">=3.12"
# Runtime dependencies = third-party imports actually found in alahd_erp/ (audit 2026-11-14).
# Deliberately UNPINNED here: exact versions of the shipping build must be frozen in
# requirements.lock on the Windows build machine (see docs/DEVELOPMENT.md). NOT VERIFIED against a lock.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pywebview",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "httpx"]   # httpx: required by fastapi.testclient (tests/test_http_api.py); dev-only
build = ["pyinstaller"]

[tool.setuptools.packages.find]
include = ["alahd_erp*"]

[tool.setuptools.package-data]
alahd_erp = ["ui/**/*", "icon.ico"]

# ---------------------------------------------------------------- tests
# The suite is plain unittest (no third-party test dependency).
# Canonical runner (verified): python -m unittest discover -s tests -t .

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Conservative baseline: real errors only. Style rules are added incrementally in later phases.
select = ["E4", "E7", "E9", "F", "B006", "B008", "B904", "S102", "S307"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"alahd_erp/main.py" = ["E402"]   # sys.path bootstrap before imports is intentional

# ---------------------------------------------------------------- mypy (incremental)
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["alahd_erp/domain", "alahd_erp/config.py"]   # start with the pure-logic layer
